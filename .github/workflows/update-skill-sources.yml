name: update-skill-sources

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update the skill-source inputs
        run: |
          mapfile -t inputs < <(nix flake metadata --json | jq -r '.locks.nodes.root.inputs | keys[] | select(. != "nixpkgs")')
          nix flake update "${inputs[@]}"

      - name: Build every skill payload through the gates
        run: nix flake check --print-build-logs

      - name: Push the bumped lock when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "flake.lock unchanged"
          else
            git commit -m "bump skill sources"
            git push
          fi

      - name: Open an issue when the run fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[CI] weekly skill update failed";
            const body = `Run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} failed; the lock bump was not pushed. Fix the needle or gate upstream-side, or hold the rev.`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open" });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
